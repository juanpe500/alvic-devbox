name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly rebuild picks up Ubuntu security updates and new Claude Code / gh / tailscale.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  agent-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Agent smoke test
        run: |
          sudo apt-get install -y tmux ripgrep >/dev/null
          pip install -q -r agent/requirements.txt websockets
          # Like the image: a `claude` in ~/.local/bin that login shells find first (here the fake).
          mkdir -p /tmp/devhome/.local/bin
          cp tests/fake_claude /tmp/devhome/.local/bin/claude && chmod +x /tmp/devhome/.local/bin/claude
          printf 'export PATH="$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin"\n' > /tmp/devhome/.profile
          export HOME=/tmp/devhome PATH="/tmp/devhome/.local/bin:$PATH" AGENT_TOKEN=testtoken
          uvicorn agent:app --app-dir agent --host 127.0.0.1 --port 7799 > /tmp/agent.log 2>&1 &
          sleep 3
          python tests/agent_smoke.py || { cat /tmp/agent.log; exit 1; }
          python tests/claude_smoke.py || { cat /tmp/agent.log; exit 1; }

  build:
    needs: agent-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
